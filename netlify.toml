[build]
  publish = "public"

[[redirects]]
  from = "https://kyledanielgordon.com/*"
  to = "https://www.kyledanielgordon.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
